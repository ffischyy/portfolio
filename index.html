<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ethan Luong | Inside the PC</title>
  <meta name="description" content="Ethan Luong, Computer Engineering at the University of Guelph. Projects, skills and a 3D model of my PC.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="grid" aria-hidden="true"><canvas></canvas></div>
  <div id="folder" class="folder-float">
    <div class="folder-float__folder">
      <span class="folder-float__back" aria-hidden="true"></span>
      <span class="folder-float__paper" aria-hidden="true"></span>
      <span class="folder-float__front" aria-hidden="true">
        <span class="folder-float__label">Projects</span>
        <span class="folder-float__sub" id="folder-sub"></span>
      </span>
      <button type="button" class="folder-float__trigger" id="folder-open"></button>
    </div>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="tags"></div>

  <aside id="hud" class="profile-card" aria-label="Ethan Luong">
    <div class="profile-card__body">
      <div class="profile-card__tile">
        <span class="profile-card__sheen"></span>
        <span class="profile-card__holo">
          <span class="profile-card__holo-glow"></span>
          <span class="profile-card__holo-shift"></span>
        </span>
        <img class="profile-card__photo" src="assets/profile.jpg" alt="Ethan looking out over the water from a rocky shore" draggable="false">
        <span class="profile-card__scrim"></span>
        <div class="profile-card__info">
          <h1 class="profile-card__name" id="id-name"></h1>
          <p class="profile-card__title" id="id-major"></p>
        </div>
        <span class="profile-card__tile-rim"></span>
      </div>
      <div class="profile-card__footer" id="hud-links"></div>
      <span class="profile-card__glare"></span>
      <span class="profile-card__shade"></span>
      <span class="profile-card__rim"></span>
    </div>
  </aside>

  <button id="back" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back out of the case</button>

  <nav id="plain" aria-label="All sections" hidden></nav>

  <section id="panel" role="dialog" aria-labelledby="panel-title" tabindex="-1" hidden>
    <header>
      <p id="panel-chip"></p>
      <button id="panel-close" aria-label="Close panel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </header>
    <h2 id="panel-title"></h2>
    <div id="panel-body"></div>
  </section>

  <section id="deck" aria-label="Projects" hidden>
    <div id="tunnel" aria-hidden="true"><canvas></canvas></div>
    <div class="circular-carousel" id="ring" data-draggable data-ready>
      <div class="circular-carousel__view">
        <div class="circular-carousel__stage" id="ring-stage">
          <div class="circular-carousel__camera" id="ring-camera">
            <div class="circular-carousel__ring" id="ring-ring"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="deck-keys"></div>
    <button id="deck-back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back</button>
  </section>

  <div id="boot" hidden>
    <pre id="boot-text"></pre>
    <button id="boot-skip">Skip</button>
  </div>

  <noscript>
    <p style="padding:24px;color:#fff">This site needs JavaScript to show its content. Please turn it on and reload.</p>
  </noscript>

  <script src="content.js"></script>
  <script src="ui.js"></script>
  <script src="shapegrid.js"></script>
  <script src="tunnel.js"></script>
  <script src="holo.js"></script>
  <script src="profile.js"></script>
  <script src="cards.js"></script>
  <!-- If Three.js can't load, the site still works as a plain list of sections -->
  <script src="main.js"></script>
</body>
</html>
